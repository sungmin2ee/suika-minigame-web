<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수박게임</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#24432d;font:700 16px system-ui;color:#fff7d6}main{min-height:100dvh;display:grid;place-items:center}button{font:inherit;cursor:pointer;border:0;color:#472509;background:#ffcb54;border-radius:16px;padding:.7em 1em;box-shadow:0 4px #8b4a15}button:focus-visible,canvas:focus-visible{outline:3px solid white}#launch{display:grid;justify-items:center;gap:6px}#launch span{font-size:2.2rem}dialog{border:0;background:none;color:inherit;padding:0;max-width:100vw;max-height:100dvh}dialog::backdrop{background:#0009}.game{width:100%;aspect-ratio:2/3;position:relative;background:url(tropical-frame-v2.png) center/contain no-repeat}.hud{position:absolute;top:1%;left:23%;right:23%;display:flex;justify-content:space-between;text-shadow:0 2px 4px black}#close{position:absolute;right:2%;top:1%;z-index:2;padding:0;width:44px;height:40px;font-size:24px;background:transparent url(assets/close-button.png) center/contain no-repeat;box-shadow:none}canvas{position:absolute;left:18.36%;top:14.84%;width:63.1%;height:60.68%;touch-action:none;background:#162d2180;cursor:crosshair}#result{border-radius:24px;background:#fff3ce;color:#492b15;padding:26px;text-align:center;min-width:min(280px,90vw)}#result h2{margin-top:0}#result::backdrop{background:#0007}
#game{width:min(92vw,calc((100dvh - 90px) * 2 / 3),540px);overflow:hidden}.order{background:#203d21;border:1px solid #688648;border-radius:14px;padding:6px 8px 8px;text-align:center;font-size:13px}.order ol{display:flex;align-items:center;justify-content:space-between;gap:2px;list-style:none;margin:4px 0 0;padding:0}.order li{display:flex;align-items:center;gap:2px;min-width:0;flex:1}.order li:last-child{flex:.7}.order li:not(:last-child)::after{content:"›";color:#ffe2a0}.order canvas{position:static;display:block;width:100%;max-width:32px;height:auto;min-width:0;background:none;cursor:default}
#game{width:min(92vw,calc((100dvh - 144px) * 2 / 3),540px)}
.hud{position:static;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px;align-items:center;margin:0 0 6px}
.stat{background:linear-gradient(#41652c,#213b1c);border:1px solid #789a49;color:#fff0bc;box-shadow:0 2px 4px #0006}
.stat{grid-column:2;justify-self:center;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 9px;border-radius:20px;font-size:clamp(12px,4vw,18px);font-variant-numeric:tabular-nums;white-space:nowrap}.stat small{font-size:clamp(9px,2.7vw,12px)}
#close{position:static;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;line-height:1}
.timer-label{display:inline-flex;align-items:center;gap:3px}.timer-label span{font-size:1.15em;line-height:1}#upcoming{position:absolute;right:19%;top:4%;width:16%;display:grid;justify-items:center;gap:2px;color:#fff5d2;font-size:clamp(9px,3vw,15px);text-shadow:0 2px 3px #29160a;pointer-events:none}
#upcoming-icon{position:static;width:78%;height:auto;aspect-ratio:1;border-radius:50%;background:#503820;border:1px solid #f4d58a}
#result{width:min(88vw,420px);padding:20px;background:linear-gradient(#5b361e,#301b11);color:#fff3d1;border:2px solid #c79042}
#result::backdrop{background:#1e130bba;backdrop-filter:blur(4px)}
#result h2,#result p{margin:0 0 12px}
.reward-action{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:70px;margin:10px auto;padding:8px 14px;color:#fff8df;text-shadow:0 2px 2px #583315;background:transparent url(assets/reward-button.png) center/100% 100% no-repeat;box-shadow:none}
.reward-action:disabled{cursor:default}
.reward-action small{display:block}
.reward-action img,.reward-total img{width:42px;height:auto}
#done{width:76%;min-height:54px}
.reward-total{display:inline-flex;align-items:center;gap:8px;padding:3px 16px;background:#21150dcc;border:2px solid #fff;border-radius:99px}
</style>
<main><button id="launch"><span aria-hidden="true">🎮</span>미니게임</button></main>
<dialog id="game" aria-label="수박게임">
<header class="hud"><div class="stat"><small class="timer-label"><span aria-hidden="true">⏳</span> 남은 시간</small><span id="time" role="timer">0:50</span></div><button id="close" aria-label="닫기"></button></header><div class="game"><canvas id="board" width="320" height="462" tabindex="0" aria-label="과일 놓기. 방향키로 조준하고 스페이스로 놓으세요."></canvas><div id="upcoming" role="img"><canvas id="upcoming-icon" width="64" height="64" aria-hidden="true"></canvas><span>다음</span></div></div><section class="order" aria-labelledby="order-title"><strong id="order-title">합체 순서</strong><ol id="fruit-order"></ol></section>
</dialog>
<dialog id="result" aria-labelledby="result-title"><h2 id="result-title">게임 종료</h2><button type="button" class="reward-action" disabled><img src="assets/reward-gold.png" alt=""><span><strong id="reward-double"></strong> · 광고 보고 2배 획득<small>광고 준비 중</small></span></button><button id="done" class="reward-action">다음에</button><div class="reward-total" aria-label="획득 골드"><img src="assets/reward-gold.png" alt=""><strong id="reward-earned"></strong></div></dialog>
<script src="game.js?v=timeout-50"></script>
</html>
